<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ย้ายไปที่ เช็คห้อง · Room Check</title>

<!-- ปลายทางใหม่ — แก้บรรทัดเดียวตรงนี้ถ้าเปลี่ยนชื่อ repo อีก -->
<link rel="canonical" href="https://nattapornkun18.github.io/roomcheck/">
<meta http-equiv="refresh" content="2; url=https://nattapornkun18.github.io/roomcheck/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141C28; --mute:#6B7A8D; --paper:#E9EDF2; --card:#fff; --line:#D6DDE6; --brass:#B8862B;
    --sans:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--brass);
       border-radius:10px;padding:24px 22px;max-width:420px;width:100%;text-align:center}
  .tick{width:36px;height:3px;background:var(--brass);border-radius:2px;margin:0 auto 16px}
  h1{font-size:17px;font-weight:600;margin:0 0 8px}
  p{font-size:13.5px;color:var(--mute);margin:0 0 18px}
  a.go{display:block;background:var(--ink);color:#fff;text-decoration:none;font-size:15px;
       font-weight:700;padding:14px;border-radius:10px}
  .url{margin-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--mute);word-break:break-all}
</style>
</head>
<body>
  <div class="box">
    <div class="tick"></div>
    <h1>หน้าเช็คม่านย้ายไปรวมที่ใหม่แล้ว</h1>
    <p>ตอนนี้ม่านกับซิลิโคนอยู่ในเว็บเดียวกัน เลือกหมวดก่อนแล้วค่อยเลือกห้อง<br>
       กำลังพาไปที่ใหม่ ถ้าไม่ไปเองให้กดปุ่มข้างล่าง</p>
    <a class="go" href="https://nattapornkun18.github.io/roomcheck/">ไปที่ เช็คห้อง →</a>
    <div class="url">https://nattapornkun18.github.io/roomcheck/</div>
  </div>
</body>
</html>
